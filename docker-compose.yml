services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_ROOT: /app/artifacts/models
      MODEL_VERSION: ${MODEL_VERSION:-baseline-v1}
    volumes:
      - type: bind
        source: ./artifacts/models
        target: /app/artifacts/models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
